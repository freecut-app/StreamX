<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamX Control</title>
<style>
  :root { --bg:#0b0d12; --panel:#141821; --line:#232a38; --text:#e6e9f0; --muted:#8a93a6; --acc:#1f8bff; --rec:#e5223e; --ok:#28d7a0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 "Segoe UI",system-ui,sans-serif; padding:16px; max-width:560px; margin:auto; }
  h1 { font-size:20px; margin:4px 0 16px; } h1 b { color:var(--acc); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button { flex:1; min-width:120px; padding:14px; border-radius:10px; border:1px solid var(--line); background:#1a1f2b; color:var(--text); font:600 15px "Segoe UI",sans-serif; cursor:pointer; }
  button.on { background:var(--rec); border-color:var(--rec); }
  button.acc { background:var(--acc); border-color:var(--acc); }
  button.scene.on { background:var(--acc); border-color:var(--acc); }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0f1219; color:var(--text); font-size:15px; }
  .muted { color:var(--muted); font-size:13px; }
  .stat { display:flex; justify-content:space-between; padding:3px 0; }
  #err { color:#ff6b7d; min-height:20px; }
</style>
</head>
<body>
<h1><b>Stream</b>X Control</h1>
<div class="card" id="login">
  <p class="muted">Digite o token mostrado no StreamX (Controle remoto). Ele fica salvo só neste navegador.</p>
  <input id="token" placeholder="Token" autocomplete="off">
  <div class="row" style="margin-top:10px"><button class="acc" id="save">Conectar</button></div>
</div>
<div id="app" hidden>
  <div class="card">
    <div class="row">
      <button id="rec">● Gravar</button>
      <button id="stream">Transmitir</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="clip">Salvar clipe</button>
      <button id="clipbuf">Clip It: ligar</button>
    </div>
  </div>
  <div class="card"><div class="muted" style="margin-bottom:8px">Cenas</div><div class="row" id="scenes"></div></div>
  <div class="card" id="stats"></div>
  <div class="row"><button id="logout">Sair</button></div>
</div>
<p id="err"></p>
<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem('streamx-token') || '';
let last = null;
const fmt = ms => { const s = Math.floor(ms / 1000); return [s / 3600, s / 60 % 60, s % 60].map(v => String(Math.floor(v)).padStart(2, '0')).join(':'); };
async function api(path, body) {
  const r = await fetch(path, { method: body === undefined && path === '/api/status' ? 'GET' : 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin('Token inválido.'); throw new Error('401'); }
  $('err').textContent = j.error || '';
  return j;
}
function showLogin(msg) { $('login').hidden = false; $('app').hidden = true; $('err').textContent = msg || ''; }
function render(s) {
  last = s;
  $('rec').textContent = s.recording.active ? '■ Parar gravação ' + fmt(s.recording.elapsedMs) : '● Gravar';
  $('rec').classList.toggle('on', s.recording.active);
  $('stream').textContent = s.streaming.active ? '■ Parar transmissão ' + fmt(s.streaming.elapsedMs) : 'Transmitir';
  $('stream').classList.toggle('on', s.streaming.active);
  $('clip').disabled = !s.clipIt.active;
  $('clipbuf').textContent = s.clipIt.active ? 'Clip It: desligar' : 'Clip It: ligar (' + s.clipIt.seconds + ' s)';
  const box = $('scenes');
  if (box.dataset.list !== JSON.stringify(s.scenes)) {
    box.innerHTML = '';
    s.scenes.forEach(n => { const b = document.createElement('button'); b.className = 'scene'; b.textContent = n; b.onclick = () => api('/api/scene', { name: n }).then(render); box.appendChild(b); });
    box.dataset.list = JSON.stringify(s.scenes);
  }
  [...box.children].forEach(b => b.classList.toggle('on', b.textContent === s.scene));
  $('stats').innerHTML = `<div class="stat"><span>CPU</span><b>${s.perf.cpu}%</b></div><div class="stat"><span>GPU</span><b>${s.perf.gpu < 0 ? '—' : s.perf.gpu + '%'}</b></div><div class="stat"><span>FPS</span><b>${s.perf.fps.toFixed(0)}</b></div>`;
}
async function poll() { if (!token) return; try { render(await api('/api/status')); $('login').hidden = true; $('app').hidden = false; } catch (e) {} }
$('save').onclick = () => { token = $('token').value.trim(); localStorage.setItem('streamx-token', token); poll(); };
$('logout').onclick = () => { localStorage.removeItem('streamx-token'); token = ''; showLogin(); };
$('rec').onclick = () => api('/api/record/' + (last && last.recording.active ? 'stop' : 'start')).then(render);
$('stream').onclick = () => api('/api/stream/' + (last && last.streaming.active ? 'stop' : 'start')).then(render);
$('clip').onclick = () => api('/api/clip/save').then(render);
$('clipbuf').onclick = () => api('/api/clip/' + (last && last.clipIt.active ? 'stop' : 'start')).then(render);
if (token) poll(); else showLogin();
setInterval(poll, 1000);
</script>
</body>
</html>
