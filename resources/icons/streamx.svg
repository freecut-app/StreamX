<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd0ff"/>
      <stop offset="0.55" stop-color="#1f8bff"/>
      <stop offset="1" stop-color="#2a4dff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="base"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="20" rx="330" ry="200" fill="#ffffff" opacity=".06" clip-path="url(#base)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110" fill="none" stroke="#1f8bff" stroke-opacity=".45" stroke-width="3"/>
  <!-- X formado por duas faixas, uma delas "cortada" pelo ponto de gravação -->
  <g filter="url(#glow)" stroke-linecap="round">
    <path d="M150 140 L362 372" stroke="url(#blue)" stroke-width="58" fill="none"/>
    <path d="M362 140 L292 216" stroke="url(#blue)" stroke-width="58" fill="none"/>
    <path d="M220 296 L150 372" stroke="url(#blue)" stroke-width="58" fill="none"/>
  </g>
  <!-- ondas de transmissão -->
  <g fill="none" stroke="#5fd0ff" stroke-width="12" stroke-linecap="round" opacity=".85">
    <path d="M396 92 a46 46 0 0 1 24 40"/>
    <path d="M410 64 a78 78 0 0 1 40 66"/>
  </g>
  <!-- ponto de gravação -->
  <circle cx="380" cy="132" r="22" fill="#ff3b4f"/>
</svg>
